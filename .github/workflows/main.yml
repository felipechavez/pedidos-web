# CI de Pedidos Web: compila la solución y corre los tests xUnit
# en cada push y en cada pull request hacia main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos: el workflow solo necesita leer el código.
permissions:
  contents: read

# Si llega un push nuevo a la misma rama o PR, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-y-test:
    name: Build y test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.404

      - name: Restaurar paquetes
        run: dotnet restore PedidosWeb.sln

      - name: Compilar
        run: dotnet build PedidosWeb.sln --no-restore --configuration Release

      - name: Ejecutar tests
        run: dotnet test PedidosWeb.sln --no-build --configuration Release --verbosity normal
